[project]
name = "app"
version = "0.1.0"
description = "Travel Management API"
readme = "README.md"
authors = [
    { name = "Partha Pratim Sutradhar", email = "parthasutradhar.tech@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
