name: Deploy Gantabyaa API

on:
  push:
    branches:
      - main

concurrency:
  group: gantabyaa-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/home/gantabyaa-api/htdocs/api.gantabyaa.in"
            UV="/home/gantabyaa-api/.local/bin/uv"

            echo "==> Fetching latest code"
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e .venv

            echo "==> Installing dependencies"
            "$UV" sync --frozen

            echo "==> Running database migrations"
            "$UV" run alembic upgrade head

            echo "==> Restarting API"
            sudo -n /usr/bin/systemctl restart gantabyaa-api

            echo "==> Waiting for API"

            for i in {1..30}; do
              if sudo -n /usr/bin/systemctl is-active --quiet gantabyaa-api; then
                if curl -fsS http://127.0.0.1:8000/docs >/dev/null 2>&1; then
                  echo "==> API is healthy"
                  exit 0
                fi
              fi

              echo "Waiting for API... attempt $i/30"
              sleep 2
            done

            echo "==> API failed to become healthy"

            sudo -n /usr/bin/systemctl status gantabyaa-api --no-pager -l || true

            echo "==> Recent API logs"
            sudo -n /usr/bin/journalctl -u gantabyaa-api -n 100 --no-pager || true

            exit 1